[platformio]
default_envs = k151_bridge
src_dir = src
include_dir = include
test_dir = test

[env:k151_bridge]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.bridge.csv
board_build.filesystem = spiffs
lib_extra_dirs =
  /private/tmp/feedx-stackchan-bsp
  /private/tmp/feedx-m5unified
  /private/tmp/feedx-m5gfx
  /private/tmp/feedx-irremote
  /private/tmp/feedx-nfc
  /private/tmp/feedx-arduinojson
lib_ldf_mode = chain+
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D UART_SCLK_DEFAULT=UART_SCLK_XTAL
  -D GUEST_AI_BRIDGE_VERSION=\"0.2.0\"
  -D GUEST_AI_PROTOCOL_VERSION=\"1.0\"
build_unflags = -std=gnu++11

[env:native]
platform = native
test_build_src = false
