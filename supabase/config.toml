project_id = "feedx"

[functions.factory-mesti-mcp]
# Staging-only; opaque machine credential and Role Settings grant are validated in the database.
verify_jwt = false

[functions.payroll-payslips]
# Admin Auth and opaque Crew tokens are validated in the existing function body.
verify_jwt = false

[functions.recruitment-realtime]
# The candidate has no Auth account. The function validates the invitation and active lease through a service-only RPC.
verify_jwt = false

[functions.recruitment-evidence]
# Invitation lease or canonical Admin Auth/scope is validated within the function.
verify_jwt = false

[functions.recruitment-report]
verify_jwt = false

[functions.recruitment-voice-lab]
# Staging-only, validates Admin Auth and canonical recruitment.manage permission.
verify_jwt = false

[functions.marketing-meta]
# Public Meta callbacks verify state/HMAC; all Admin commands verify Supabase Auth and canonical brand/action scope.
verify_jwt = false

[functions.marketing-worker]
# Scheduler uses a private worker secret; browser commands use canonical authenticated RPCs.
verify_jwt = false

[functions.marketing-inbox]
# Signed Meta webhook or canonical Auth/action/brand verification in the function.
verify_jwt = false

[functions.marketing-privacy]
# Restricted operator/restore endpoint authenticates the server-only worker secret.
verify_jwt = false

[functions.marketing-ads]
# Canonical Admin Auth, brand/action scope; external mutation endpoints are not enabled.
verify_jwt = false

[functions.marketing-drive]
# Fixed OAuth callback with one-time state; every browser command verifies canonical Auth/scope.
verify_jwt = false

[functions.google-business]
# HTTPS OAuth callback uses expiring one-time state/PKCE; commands verify Admin Auth and canonical outlet/permission scope.
verify_jwt = false
